name: A1 SQLite evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    if: github.head_ref == 'fix/ai-schema-fallback' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.0"
      - name: Prepare comparable locked environments
        run: |
          mkdir -p "$RUNNER_TEMP/a1"
          uv sync --locked --directory base/server
          uv sync --locked --directory candidate/server
      - name: Compare complete SQLite controls
        run: |
          for tree in base candidate; do
            (
              cd "$tree"
              export PYTEST_ADDOPTS="--junitxml=$RUNNER_TEMP/a1/$tree.xml"
              /usr/bin/time -f '%e' -o "$RUNNER_TEMP/a1/$tree.seconds" scripts/check-ci server
            )
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ["RUNNER_TEMP"]) / "a1"

          def check(label):
              cases = list(ET.parse(evidence / f"{label}.xml").iter("testcase"))
              failures = sum(case.find("failure") is not None for case in cases)
              errors = sum(case.find("error") is not None for case in cases)
              skipped = {(case.attrib["classname"], case.attrib["name"]) for case in cases
                         if case.find("skipped") is not None}
              seconds = (evidence / f"{label}.seconds").read_text().strip()
              print(f"{label}: {len(cases)} cases, {failures} failures, {errors} errors, "
                    f"{len(skipped)} skips, {seconds}s")
              assert cases and not failures and not errors
              return skipped

          assert check("base") == check("candidate"), "SQLite skip IDs changed"
          PY
      - name: Upload controls and wall times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a1-sqlite
          path: ${{ runner.temp }}/a1/
