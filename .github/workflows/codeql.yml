name: CodeQL

on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", "scripts/**", ".github/workflows/codeql.yml"]
  pull_request:
    paths: ["server/**", "web/**", "scripts/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "57 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Python and web security analysis
    # Private code scanning requires eligible hosting and an enabled license.
    # Set this opt-in only after verifying both; otherwise report a skipped job.
    if: ${{ github.event.repository.private == false || vars.SPUNTO_LICENSED_PRIVATE_CODEQL == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python,javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
