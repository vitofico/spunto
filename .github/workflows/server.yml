name: Server

# Lint and test the Python server, then prove its image builds for both
# architectures, starts, backs up and restores. The release workflow calls this
# too, so nothing ships that fails it.
on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".dockerignore"
      - "scripts/smoke-selfhost.sh"
      - "scripts/check-image-size.py"
      - "scripts/check-ci"
      - "scripts/check-generated.py"
      - ".github/workflows/server.yml"
      - "android/core/design/generate-tokens.py"
      - "android/core/design/src/main/java/io/theficos/spunto/core/design/Tokens.kt"
  workflow_call:
    inputs:
      release_source:
        type: string
        default: ""
      release_date:
        type: string
        default: ""
      release_tree:
        type: string
        default: ""
  schedule:
    - cron: "37 6 * * 1" # rescan unchanged images when new advisories arrive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release run never
  # waits on, or cancels, a run of this workflow on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    if: github.event_name != 'schedule'
    name: Web types, tests and budgets
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source }}
      - name: Verify the planned release source
        if: inputs.release_tree != ''
        env:
          RELEASE_DATE: ${{ inputs.release_date }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: bash "$GITHUB_WORKSPACE/scripts/release-source.sh" "$RELEASE_DATE" "$RELEASE_TREE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.9.0"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.0"
      - run: npm install --global pnpm@12.11.2
      - name: Local and hosted web preflight
        run: ../scripts/check-ci web --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/web.xml"
      - name: Retain web test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-unit-results
          path: ${{ runner.temp }}/web.xml
          if-no-files-found: error
          retention-days: 3

  test:
    if: github.event_name != 'schedule'
    name: Lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source }}
      - name: Verify the planned release source
        if: inputs.release_tree != ''
        env:
          RELEASE_DATE: ${{ inputs.release_date }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: bash "$GITHUB_WORKSPACE/scripts/release-source.sh" "$RELEASE_DATE" "$RELEASE_TREE"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # the uv in server/Dockerfile
          enable-cache: true # keyed on server/uv.lock
      - name: Local and hosted server preflight
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/sqlite.xml
        run: ../scripts/check-ci server
      - name: Retain SQLite JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sqlite-unit-results
          path: ${{ runner.temp }}/sqlite.xml
          if-no-files-found: error
          retention-days: 3

  postgres:
    if: github.event_name != 'schedule'
    name: PostgreSQL 18 isolation, hosted auth and recovery
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # Match the operator composition; a major upgrade needs reviewed migrations.
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: spunto_admin
          POSTGRES_DB: spunto_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U spunto_admin -d spunto_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source }}
      - name: Verify the planned release source
        if: inputs.release_tree != ''
        env:
          RELEASE_DATE: ${{ inputs.release_date }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: bash "$GITHUB_WORKSPACE/scripts/release-source.sh" "$RELEASE_DATE" "$RELEASE_TREE"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked
      - name: Create restricted fixture roles
        env:
          # Disposable fixture only. Requests use the two restricted roles.
          SPUNTO_TEST_POSTGRES_ADMIN_URL: postgresql://spunto_admin:${{ github.run_id }}-${{ github.run_attempt }}-ci-postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/spunto_ci
        run: |
          uv run python - <<'PY'
          import os
          import secrets
          from urllib.parse import quote, urlsplit, urlunsplit
          import psycopg
          from psycopg import sql

          admin = os.environ["SPUNTO_TEST_POSTGRES_ADMIN_URL"]
          parsed = urlsplit(admin)
          with psycopg.connect(admin) as connection, open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SPUNTO_TEST_POSTGRES_ADMIN_URL={admin}\n")
              for role, variable in (
                  ("spunto_runtime", "SPUNTO_TEST_POSTGRES_URL"),
                  ("spunto_identity", "SPUNTO_TEST_IDENTITY_URL"),
              ):
                  password = secrets.token_urlsafe(32)
                  print(f"::add-mask::{password}")
                  connection.execute(sql.SQL(
                      "CREATE ROLE {} LOGIN PASSWORD {} NOSUPERUSER NOCREATEDB "
                      "NOCREATEROLE NOINHERIT NOBYPASSRLS"
                  ).format(sql.Identifier(role), sql.Literal(password)))
                  authority = f"{role}:{quote(password, safe='')}@{parsed.hostname}:{parsed.port}"
                  url = urlunsplit((parsed.scheme, authority, parsed.path, "", ""))
                  print(f"::add-mask::{url}")
                  output.write(f"{variable}={url}\n")
              connection.execute("REVOKE CREATE ON SCHEMA public FROM PUBLIC")
              connection.execute("REVOKE ALL ON DATABASE spunto_ci FROM PUBLIC")
              connection.execute("GRANT CONNECT ON DATABASE spunto_ci TO spunto_runtime,spunto_identity")
              connection.execute("GRANT TEMPORARY ON DATABASE spunto_ci TO spunto_runtime")
          PY
      - name: Run operator migration and grant minimal access
        env:
          SPUNTO_DATABASE_ADMIN_URL: ${{ env.SPUNTO_TEST_POSTGRES_ADMIN_URL }}
          SPUNTO_DATABASE_ROLE: spunto_runtime
          SPUNTO_IDENTITY_DATABASE_ROLE: spunto_identity
        run: uv run spunto database migrate
      - name: Exercise real PostgreSQL fixtures
        run: |
          uv run pytest -m postgres --junitxml="$RUNNER_TEMP/postgres.xml" -ra
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "postgres.xml"))
          cases = report.findall(".//testcase")
          assert cases, "PostgreSQL acceptance collected no tests"
          assert not report.findall(".//skipped"), "Real PostgreSQL acceptance must not skip"
          PY
      - name: Retain PostgreSQL JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: postgres-tests
          path: ${{ runner.temp }}/postgres.xml
          if-no-files-found: error
          retention-days: 3


  image:
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    name: Image (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source }}
      - name: Verify the planned release source
        if: inputs.release_tree != ''
        env:
          RELEASE_DATE: ${{ inputs.release_date }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: bash "$GITHUB_WORKSPACE/scripts/release-source.sh" "$RELEASE_DATE" "$RELEASE_TREE"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Export gzip OCI image
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          outputs: type=oci,dest=${{ runner.temp }}/spunto.oci.tar,compression=gzip,force-compression=true
          cache-from: type=gha,scope=server-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.architecture }}
      - name: Enforce 150 MB compressed image budget
        if: github.event_name != 'schedule'
        run: >-
          python3 scripts/check-image-size.py "$RUNNER_TEMP/spunto.oci.tar"
          --platform linux/${{ matrix.architecture }}
      # Load the same architecture from the cache for scanning and hardened smoke.
      - name: Load the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: spunto:ci
          cache-from: type=gha,scope=server-${{ matrix.architecture }}
      - name: Scan OS and Python packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: spunto:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 10m0s
      - run: scripts/smoke-selfhost.sh spunto:ci
        if: github.event_name != 'schedule'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name != 'schedule' && matrix.architecture == 'amd64'
        with:
          node-version: "26.9.0"
      - name: Install pinned browser tooling
        if: github.event_name != 'schedule' && matrix.architecture == 'amd64'
        timeout-minutes: 5
        working-directory: web
        run: |
          npm install --global pnpm@12.11.2
          pnpm install --frozen-lockfile
      - name: Pull matching browser engines and system libraries
        if: github.event_name != 'schedule' && matrix.architecture == 'amd64'
        timeout-minutes: 10
        working-directory: web
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          [[ "$PLAYWRIGHT_IMAGE" == *":v${version}-noble@"* ]]
          docker pull "$PLAYWRIGHT_IMAGE"
      - name: Start disposable browser server
        if: github.event_name != 'schedule' && matrix.architecture == 'amd64'
        timeout-minutes: 2
        run: |
          docker run -d --name spunto-browser --read-only --tmpfs /tmp \
            --tmpfs /data:rw,uid=10001,gid=10001,mode=0750 --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:18081:8080 \
            -e SPUNTO_PUBLIC_URL=http://127.0.0.1:18081 \
            -e 'SPUNTO_OWNER_PASSWORD=browser acceptance password' spunto:ci
          timeout 90s bash -c '
            until curl --fail --silent --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:18081/readyz >/dev/null; do
              sleep 1
            done
          '
      - name: Chromium, Firefox and WebKit acceptance including collaboration
        id: browser_acceptance
        if: github.event_name != 'schedule' && matrix.architecture == 'amd64'
        timeout-minutes: 22
        working-directory: web
        run: |
          mkdir -p browser-artifacts
          docker run --rm --init --network host --shm-size=1g \
            --env CI=true --env SPUNTO_E2E_URL=http://127.0.0.1:18081 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --env PLAYWRIGHT_HTML_OUTPUT_DIR=/artifacts/report \
            --volume "$PWD/browser-artifacts:/artifacts" \
            --workdir "$PWD" "$PLAYWRIGHT_IMAGE" \
            node node_modules/@playwright/test/cli.js test --output=/artifacts/results \
            --project=chromium --project=firefox --project=webkit \
            --global-timeout=1200000
      - name: Remove disposable browser server
        if: always() && github.event_name != 'schedule' && matrix.architecture == 'amd64'
        timeout-minutes: 1
        run: timeout 30s docker rm -f spunto-browser || true
      - name: Make browser failure evidence readable by the runner
        if: failure() && steps.browser_acceptance.outcome == 'failure'
        run: sudo chown -Rh "$(id -u):$(id -g)" web/browser-artifacts
      - name: Retain browser failure evidence
        if: failure() && steps.browser_acceptance.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-evidence
          path: web/browser-artifacts/
          retention-days: 7
