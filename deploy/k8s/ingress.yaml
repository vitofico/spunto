apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spunto
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [spunto.example.org]
      secretName: spunto-tls
  rules:
    - host: spunto.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spunto
                port:
                  name: http
