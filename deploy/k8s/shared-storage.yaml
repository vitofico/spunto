# Create the NFS exports and include them in your backups before applying this base.
# Replace the example server 192.0.2.10 and the /srv/nfs paths with your NFS server and exports.
# Capacity here is metadata, not an enforced filesystem quota.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: spunto-backups
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: spunto
    name: spunto-backups
  mountOptions: [hard, nfsvers=4.2, timeo=600, retrans=2]
  nfs:
    server: 192.0.2.10  # replace with your NFS server
    path: /srv/nfs/spunto/backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spunto-backups
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: spunto-backups
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: spunto-attachments
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: spunto
    name: spunto-attachments
  mountOptions: [hard, nfsvers=4.2, timeo=600, retrans=2]
  nfs:
    server: 192.0.2.10  # replace with your NFS server
    path: /srv/nfs/spunto/attachments
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spunto-attachments
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: spunto-attachments
  resources:
    requests:
      storage: 20Gi
