id = "ask"
name = "Ask your notes"
version = "1.0.0"
api = "0.4"
kind = "server"
runtime = "in-process"
category = "recall"
description = "Answer a question with citations to your notes."
entry = "spunto.plugins.ask:plugin"
requires = ["ai.chat", "ai.embed"]
default = "on-with-ai"
data_version = 1
creates = "machine"
permissions = ["notes.read", "notes.create", "ai.chat", "ai.embed"]

[[contributes.commands]]
id = "ask"
title = "Ask your notes"
where = ["palette"]
online = true

[[contributes.commands]]
id = "save-answer"
title = "Save as note"
where = []
online = true
