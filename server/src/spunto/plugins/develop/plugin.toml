id = "develop"
name = "Develop a note"
version = "1.0.0"
api = "0.9"
kind = "server"
runtime = "in-process"
category = "develop"
description = "Expands a note into a linked follow-up with questions, next steps and other angles, leaving the original as it was."
entry = "spunto.plugins.develop:plugin"
requires = ["ai.chat"]
default = "off"
data_version = 1
permissions = ["notes.read", "notes.create", "ai.chat"]
creates = "machine"

[[contributes.commands]]
id = "develop"
title = "Develop this"
where = ["note-actions"]
online = true
