id = "duplicates"
name = "Duplicates"
version = "1.0.0"
api = "0.9"
kind = "server"
runtime = "in-process"
category = "organize"
description = "Finds notes that say the same thing and puts them side by side in Review, so you can compare and merge them."
entry = "spunto.plugins.duplicates:plugin"
requires = ["ai.embed"]
default = "off"
data_version = 1
permissions = ["notes.read", "suggest", "ai.embed"]

[settings]
type = "object"
[settings.properties.threshold]
title = "Minimum similarity"
description = "From 0.8 to 1. Higher finds fewer, closer pairs."
type = "number"
minimum = 0.8
maximum = 1.0
default = 0.97
